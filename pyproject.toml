[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supportagent"
version = "0.1.0"
description = "Guarded multi-step ReAct support agent (LangGraph + MCP) with human sign-off, evaluated on tau2-bench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
graph = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=2.0", "langgraph-checkpoint-postgres>=2.0",
         "psycopg[binary]>=3.2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
temporal = ["temporalio>=1.8"]
observability = ["arize-otel>=0.8", "opentelemetry-sdk>=1.25"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"supportagent.domains.retail" = ["policy.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
